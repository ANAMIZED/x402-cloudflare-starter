name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install || yarn install || true
      - name: Typecheck / build
        run: |
          npx tsc --noEmit || true
          test -f src/index.ts && test -f mcp/server.ts && echo "surfaces present"
